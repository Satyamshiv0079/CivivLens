services:
  postgres:
    image: postgres:16-alpine
    container_name: civiclens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civiclens_db}
      POSTGRES_USER: ${POSTGRES_USER:-civiclens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civiclens_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civiclens_user} -d ${POSTGRES_DB:-civiclens_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
